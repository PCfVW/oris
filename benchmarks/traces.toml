# The generated trace corpus (benchmarks/scripts/tracegen). Every trace is a pure function
# of its table here and of tracegen's exactly-pinned rand/rand_chacha.
#
# tier = "ci":    committed under examples/traces/generated/ with its transition record
#                 (generated by the C++ oracle), and replayed by all three implementations
#                 in CI (.github/workflows/trace-ci.yml).
# tier = "bench": generated on demand into benchmarks/traces/ for the benchmarks; only its
#                 SHA-256 is committed (benchmarks/trace-checksums.txt).
#
# Changing a table changes its trace: regenerate, then regenerate the records (README.md).

# ---- CI tier: a few thousand operations each ----

[[trace]]
name = "planner"
workload = "planner"
seed = 101
ops = 3000
tier = "ci"

