name: Zig Release

on:
  push:
    # Same tag scheme as Rust Publish — one vX.Y.Z tag drives both ports
    # (lockstep versioning; see ROADMAP.md).
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag/name for a manual run (e.g. a smoke test). Empty = use the pushed ref name."
        required: false
        default: ""

concurrency:
  group: zig-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release and upload the asset

jobs:
  release:
    name: Release orisnitsa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Resolve the release tag: the manual `tag` input when given (smoke tests /
      # re-releases), otherwise the pushed tag ref.
      - name: Resolve release tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && tag="${GITHUB_REF_NAME}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      # Lockstep-versioning gate (ROADMAP.md#versioning-policy): a tag pushed without
      # first bumping build.zig.zon's own .version would otherwise release a package
      # whose manifest silently disagrees with the tag that shipped it. Skipped on a
      # workflow_dispatch smoke test with no matching vX.Y.Z tag ref (TAG then has no
      # leading "v" to strip and version drift isn't the point of that run).
      - name: Verify build.zig.zon version matches the release tag
        working-directory: Zig
        run: |
          case "$TAG" in
            v*)
              want="${TAG#v}"
              got="$(grep -oP '(?<=\.version = ")[^"]+' build.zig.zon)"
              if [ "$want" != "$got" ]; then
                echo "::error::build.zig.zon .version ('$got') does not match release tag '$TAG' (expected '$want')"
                exit 1
              fi
              ;;
            *)
              echo "Non-vX.Y.Z tag/ref ('$TAG') — skipping version-match check (manual smoke-test run)."
              ;;
          esac

      # Gauntlet before releasing — safety checks ON, plus the hot-path-with-checks-off
      # build zig-ci.yml's matrix already requires.
      - name: Formatting
        working-directory: Zig
        run: zig fmt --check build.zig build.zig.zon src
      - name: Build & test (Debug + ReleaseSafe + ReleaseFast)
        working-directory: Zig
        run: |
          zig build test
          zig build test -Doptimize=ReleaseSafe
          zig build test -Doptimize=ReleaseFast

      # Re-root the Zig/ subdirectory as the package: a FLAT tarball whose root
      # holds build.zig.zon, so `zig fetch <url>` finds the manifest. A wrapper
      # directory does NOT work — verified against Zig 0.16.0. (The GitHub
      # auto-tarball is repo-rooted, hence unusable for a subdir package.) Mirrors
      # build.zig.zon's own .paths list (kept in sync by hand): include/ carries the
      # vendored oris.h (Rust/CONVENTIONS.md's G7 fix), README.md so an installed
      # package carries its own docs.
      - name: Package re-rooted tarball
        id: pkg
        run: |
          name="orisnitsa-${TAG}"
          mkdir -p "staging/${name}"
          cp -r Zig/build.zig Zig/build.zig.zon Zig/src Zig/include Zig/LICENSE-MIT Zig/LICENSE-APACHE Zig/README.md "staging/${name}/"
          tar -czf "${name}.tar.gz" -C "staging/${name}" build.zig build.zig.zon src include LICENSE-MIT LICENSE-APACHE README.md
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # Build-test the packaged tarball itself — not just the Zig/ checkout — so a
      # missing .paths entry or a re-rooting regression fails here, not in a
      # consumer's zig fetch. Exercises the exact bytes about to be released.
      - name: Build-test the packaged tarball
        run: |
          mkdir -p extracted
          tar -xzf "${{ steps.pkg.outputs.asset }}" -C extracted
          cd extracted
          zig build test
          zig build test -Doptimize=ReleaseSafe

      # Compute the package hash the way a consumer's `zig fetch` will, and surface
      # it in the release notes so it can be pinned verbatim.
      # NOTE: `zig fetch` (0.16.0) refuses to run without a build.zig in cwd, so run
      # it from Zig/ — it still hashes the external asset (verified locally),
      # referenced by absolute path since the asset sits at the workspace root.
      - name: Compute zig fetch hash
        id: hash
        working-directory: Zig
        run: echo "hash=$(zig fetch "$GITHUB_WORKSPACE/${{ steps.pkg.outputs.asset }}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ steps.pkg.outputs.asset }}
          fail_on_unmatched_files: true
          body: |
            **`orisnitsa` ${{ env.TAG }}** — the Zig port of HPHA, in lockstep with `orisnik` ${{ env.TAG }} on crates.io.

            Add it to your `build.zig.zon`:

            ```sh
            zig fetch --save=orisnitsa https://github.com/PCfVW/oris/releases/download/${{ env.TAG }}/${{ steps.pkg.outputs.asset }}
            ```

            Or pin the hash directly:

            ```zig
            .orisnitsa = .{
                .url = "https://github.com/PCfVW/oris/releases/download/${{ env.TAG }}/${{ steps.pkg.outputs.asset }}",
                .hash = "${{ steps.hash.outputs.hash }}",
            },
            ```
