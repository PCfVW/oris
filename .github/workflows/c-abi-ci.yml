name: C-ABI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: c-abi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # Builds both ports' real linkable libraries and links a real C caller
    # against each via include/oris.h — the gap this closes: zig-ci.yml only ran
    # `zig build test` (never even building the library artifacts), and neither
    # port's CI compiled a caller outside its own test binary. This is exactly
    # the failure mode the project already hit once (CHANGELOG.md: a re-rooted
    # module producing a DLL with an empty export table, caught only by manually
    # running `dumpbin /exports`) — the guard against its recurrence used to be a
    # comment; this job makes it a gate.
    name: smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Header-parity gate: Rust/include/oris.h and Zig/include/oris.h are
      # vendored, byte-identical copies of the canonical root include/oris.h
      # (each port's own package can't reference a file outside its package
      # root — see Rust/README.md's and Zig/README.md's C-linking notes). A
      # copy that drifts from the canonical header is a silent ABI mismatch
      # waiting to happen; catch it here instead.
      - name: Verify vendored oris.h copies match the canonical header
        shell: bash
        run: |
          diff include/oris.h Rust/include/oris.h
          diff include/oris.h Zig/include/oris.h

      - name: Build orisnik (release, cdylib + staticlib)
        working-directory: Rust
        run: cargo build --release

      - name: Build orisnitsa (static + shared libs)
        working-directory: Zig
        run: zig build

      # Locate each port's shared-library artifact. Windows links against an
      # explicit import-library path (its DLL search order already includes the
      # exe's own directory, so a copy alongside it is enough at runtime).
      #
      # ELF/Mach-O: neither `cargo build --release`'s .so nor Zig's .so/.dylib
      # carries a DT_SONAME/install-name of just its own bare filename. Without
      # one, the linker's fallback is to bake *whatever path it resolved the
      # library through* into the consuming binary's NEEDED entry — observed
      # directly on ubuntu-latest, where switching from a bare relative path to
      # `-L<relative dir> -l<name>` made no difference; the NEEDED entry was
      # still "Rust/target/release/liborisnik.so" either way ("cannot open
      # shared object file", LD_LIBRARY_PATH notwithstanding — per ld.so(8), any
      # NEEDED value containing a slash is used as a literal pathname, resolved
      # against the process's cwd at exec time, bypassing LD_LIBRARY_PATH/rpath
      # search entirely). An *absolute* -L path sidesteps this: whatever the
      # linker embeds is then cwd-independent, so it resolves correctly however
      # (from wherever) the smoke-test binary is later invoked. LD_LIBRARY_PATH
      # (set in the next step) stays as a second, redundant safety net for
      # whichever OS/linker combination *does* end up with a bare-filename
      # NEEDED/LC_LOAD_DYLIB entry.
      - name: Locate shared-library artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke_run
          case "${{ runner.os }}" in
            Linux)
              cp Rust/target/release/liborisnik.so smoke_run/
              cp Zig/zig-out/lib/liborisnitsa.so smoke_run/
              {
                echo "RUST_LINK_ARGS=-L$GITHUB_WORKSPACE/Rust/target/release -lorisnik"
                echo "ZIG_LINK_ARGS=-L$GITHUB_WORKSPACE/Zig/zig-out/lib -lorisnitsa"
              } >> "$GITHUB_ENV"
              ;;
            macOS)
              cp Rust/target/release/liborisnik.dylib smoke_run/
              cp Zig/zig-out/lib/liborisnitsa.dylib smoke_run/
              {
                echo "RUST_LINK_ARGS=-L$GITHUB_WORKSPACE/Rust/target/release -lorisnik"
                echo "ZIG_LINK_ARGS=-L$GITHUB_WORKSPACE/Zig/zig-out/lib -lorisnitsa"
              } >> "$GITHUB_ENV"
              ;;
            Windows)
              cp Rust/target/release/orisnik.dll smoke_run/
              cp Zig/zig-out/bin/orisnitsa.dll smoke_run/
              {
                echo "RUST_LINK_ARGS=Rust/target/release/orisnik.dll.lib"
                echo "ZIG_LINK_ARGS=Zig/zig-out/lib/import/orisnitsa.lib"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unhandled runner.os '${{ runner.os }}'"; exit 1
              ;;
          esac

      # `zig cc` (a real Clang) compiles+links tests/c-abi/smoke.c uniformly on
      # all three OSes — no per-OS MSVC/gcc setup action needed, since Zig is
      # already a build dependency of this job. $RUST_LINK_ARGS/$ZIG_LINK_ARGS
      # deliberately expand unquoted: each is a shell word list (a path on
      # Windows, "-L... -l..." on Unix), not a single token.
      - name: Compile and run the C smoke test against both ports
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          zig cc -Iinclude tests/c-abi/smoke.c $RUST_LINK_ARGS -o "smoke_run/smoke_rust${ext}"
          zig cc -Iinclude tests/c-abi/smoke.c $ZIG_LINK_ARGS -o "smoke_run/smoke_zig${ext}"
          cd smoke_run
          export LD_LIBRARY_PATH="$PWD:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$PWD:${DYLD_LIBRARY_PATH:-}"
          "./smoke_rust${ext}"
          "./smoke_zig${ext}"

  # Aggregator gate: a single stable check to require in branch protection,
  # matching rust-ci.yml's/zig-ci.yml's own pattern.
  c-abi-ci-success:
    name: C-ABI CI success
    needs: [smoke-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `contains(needs.*.result, 'failure')` does NOT reliably surface a matrix
      # job's per-leg failures here — confirmed empirically (not just suspected):
      # a genuine "smoke test on ubuntu-latest" step failure in this same job's
      # matrix left this step skipped and the job green. Check the dependency by
      # name instead; `!= 'success'` also catches 'cancelled'/'skipped'.
      - name: Fail if any required job did not succeed
        if: needs.smoke-test.result != 'success'
        run: |
          echo "One or more required C-ABI CI jobs failed or were cancelled."
          exit 1
