name: Trace CI

# The cross-port invariant, checked rather than argued (ROADMAP.md, v0.3.0): every trace of
# the corpus (examples/traces/) is replayed by orisnik, orisnitsa and the 2007 HPHA
# reference, and each one's transition record must equal the committed .record file byte
# for byte. The records were generated by the HPHA oracle, so both ports are held to the
# specification itself, not merely to each other. See docs/traces.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tracegen:
    # The generated corpus is a pure function of benchmarks/traces.toml and tracegen's
    # pinned dependencies. Verifying on all three OSes is also the proof that generation is
    # platform-independent (the committed files were generated on one machine).
    name: tracegen verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: benchmarks/scripts/tracegen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/scripts/tracegen
      - name: Formatting and lints
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Verify the corpus and the bench-trace checksums
        run: cargo run --release -- verify

  parity:
    name: Rust and Zig replay the corpus on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build the replayers
        shell: bash
        run: |
          set -euo pipefail
          (cd Rust && cargo build --release --example replay --features trace)
          (cd Zig && zig build replay -Doptimize=ReleaseSafe -- ../examples/traces/handwritten/grammar-example.trace > /dev/null)
      - name: Replay every trace and compare with its record
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for trace in examples/traces/handwritten/*.trace examples/traces/generated/*.trace; do
            record="${trace%.trace}.record"
            Rust/target/release/examples/replay "$trace" > rust.out
            (cd Zig && zig build replay -Doptimize=ReleaseSafe -- "../$trace") > zig.out
            for port in rust zig; do
              if ! cmp -s "$port.out" "$record"; then
                echo "::error file=$record::the $port record differs from the committed one"
                diff "$record" "$port.out" | head -20 || true
                status=1
              fi
            done
          done
          exit $status

  oracle:
    # HPHA is Win32-only (hpha.h refuses any other platform), so the reference replays on
    # Windows alone; the committed records carry its verdict to the other two OSes.
    name: HPHA oracle replays the corpus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Patch a scratch copy of HPHA and build the oracle
        shell: pwsh
        run: |
          $exe = & Cpp/oracle/build_trace_oracle.ps1 -OutDir "$env:RUNNER_TEMP\oris-trace-oracle"
          "ORACLE=$exe" >> $env:GITHUB_ENV
      - name: Replay every trace and compare with its record
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for trace in examples/traces/handwritten/*.trace examples/traces/generated/*.trace; do
            record="${trace%.trace}.record"
            "$ORACLE" "$trace" > cpp.out
            if ! cmp -s cpp.out "$record"; then
              echo "::error file=$record::the HPHA oracle's record differs from the committed one"
              diff "$record" cpp.out | head -20 || true
              status=1
            fi
          done
          exit $status

  # Aggregator gate: a single stable check to require in branch protection, matching the
  # other workflows' pattern (each dependency checked by name: `contains(needs.*.result,
  # 'failure')` does not reliably surface a matrix leg's failure).
  trace-ci-success:
    name: Trace CI success
    needs: [tracegen, parity, oracle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: |
          needs.tracegen.result != 'success' ||
          needs.parity.result != 'success' ||
          needs.oracle.result != 'success'
        run: |
          echo "One or more required Trace CI jobs failed or were cancelled."
          exit 1
