name: Trace CI

# The cross-port invariant, checked rather than argued (ROADMAP.md, v0.3.0): every trace of
# the corpus (examples/traces/) is replayed by orisnik, orisnitsa and the 2007 HPHA
# reference, and each one's transition record must equal the committed .record file byte
# for byte. The records were generated by the HPHA oracle, so both ports are held to the
# specification itself, not merely to each other. Every trace under rejected/ must be refused
# by all three, with the committed message. See docs/traces.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tracegen:
    # The generated corpus is a pure function of benchmarks/traces.toml and tracegen's
    # pinned dependencies. Verifying on all three OSes is also the proof that generation is
    # platform-independent (the committed files were generated on one machine).
    name: tracegen verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: benchmarks/scripts/tracegen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/scripts/tracegen
      - name: Formatting and lints
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Verify the corpus and the bench-trace checksums
        run: cargo run --release -- verify

  parity:
    name: Rust and Zig replay the corpus on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build the replayers
        shell: bash
        run: |
          set -euo pipefail
          (cd Rust && cargo build --release --example replay --features trace)
          (cd Zig && zig build replay -Doptimize=ReleaseSafe -- ../examples/traces/handwritten/grammar-example.trace > /dev/null)
      - name: Replay every trace and compare with its record
        shell: bash
        run: |
          # `shell: bash` runs with -e; turn it off so an expected non-zero exit is captured and reported.
          set +e -uo pipefail
          status=0
          for trace in examples/traces/handwritten/*.trace examples/traces/generated/*.trace; do
            record="${trace%.trace}.record"
            Rust/target/release/examples/replay "$trace" > rust.out || { echo "::error file=$trace::orisnik's replay failed"; status=1; }
            (cd Zig && zig build replay -Doptimize=ReleaseSafe -- "../$trace") > zig.out || { echo "::error file=$trace::orisnitsa's replay failed"; status=1; }
            for port in rust zig; do
              if ! cmp -s "$port.out" "$record"; then
                echo "::error file=$record::the $port record differs from the committed one"
                diff "$record" "$port.out" | head -20 || true
                status=1
              fi
            done
          done
          exit $status
      - name: Refuse every rejected trace, with the committed message
        shell: bash
        run: |
          # `shell: bash` runs with -e; turn it off so an expected non-zero exit is captured and reported.
          set +e -uo pipefail
          status=0
          for trace in examples/traces/rejected/*.trace; do
            expected="$(cat "${trace%.trace}.expected")"
            for port in rust zig; do
              if [ "$port" = rust ]; then
                Rust/target/release/examples/replay "$trace" > out.txt 2> err.txt; code=$?
              else
                (cd Zig && zig build replay -Doptimize=ReleaseSafe -- "../$trace" > ../out.txt 2> ../err.txt); code=$?
              fi
              message="$(grep -E '^replay: ' err.txt | sed -E 's/^replay: [^:]*\.trace: //')"
              if [ "$code" = 0 ] || [ -s out.txt ] || [ "$message" != "$expected" ]; then
                echo "::error file=$trace::$port: exit $code, message: $message (expected: $expected)"
                status=1
              fi
            done
          done
          exit $status

  oracle:
    # HPHA is Win32-only (hpha.h refuses any other platform), so the reference replays on
    # Windows alone; the committed records carry its verdict to the other two OSes.
    name: HPHA oracle replays the corpus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Patch a scratch copy of HPHA and build the oracle
        shell: pwsh
        run: |
          $exe = & Cpp/oracle/build_trace_oracle.ps1 -OutDir "$env:RUNNER_TEMP\oris-trace-oracle"
          "ORACLE=$exe" >> $env:GITHUB_ENV
      - name: Replay every trace and compare with its record
        shell: bash
        run: |
          # `shell: bash` runs with -e; turn it off so an expected non-zero exit is captured and reported.
          set +e -uo pipefail
          status=0
          for trace in examples/traces/handwritten/*.trace examples/traces/generated/*.trace; do
            record="${trace%.trace}.record"
            "$ORACLE" "$trace" > cpp.out || { echo "::error file=$trace::the oracle's replay failed"; status=1; }
            if ! cmp -s cpp.out "$record"; then
              echo "::error file=$record::the HPHA oracle's record differs from the committed one"
              diff "$record" cpp.out | head -20 || true
              status=1
            fi
          done
          for trace in examples/traces/rejected/*.trace; do
            expected="$(cat "${trace%.trace}.expected")"
            "$ORACLE" "$trace" > out.txt 2> err.txt; code=$?
            message="$(grep -E '^replay: ' err.txt | sed -E 's/^replay: [^:]*\.trace: //')"
            if [ "$code" = 0 ] || [ -s out.txt ] || [ "$message" != "$expected" ]; then
              echo "::error file=$trace::oracle: exit $code, message: $message (expected: $expected)"
              status=1
            fi
          done
          exit $status

  bench-tools:
    # The benchmark harnesses and the mimalloc-bench shims are not part of either port's
    # package, so nothing else builds them; this keeps them from rotting as the ports change.
    name: Benchmark tools build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Rust tools (bench-rust, aggregate, preload-rust)
        run: |
          (cd benchmarks/scripts/bench-rust && cargo clippy --release --no-default-features --features mimalloc -- -D warnings)
          (cd benchmarks/scripts/aggregate && cargo clippy --release -- -D warnings)
          (cd benchmarks/mimalloc-bench/preload-rust && cargo clippy --release -- -D warnings)
      - name: Zig tools (bench-zig, preload-zig)
        run: |
          (cd benchmarks/scripts/bench-zig && zig fmt --check build.zig build.zig.zon src && zig build -Doptimize=ReleaseFast)
          (cd benchmarks/mimalloc-bench/preload-zig && zig fmt --check build.zig build.zig.zon src && zig build -Doptimize=ReleaseFast)

  # Aggregator gate: a single stable check to require in branch protection, matching the
  # other workflows' pattern (each dependency checked by name: `contains(needs.*.result,
  # 'failure')` does not reliably surface a matrix leg's failure).
  trace-ci-success:
    name: Trace CI success
    needs: [tracegen, parity, oracle, bench-tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: |
          needs.tracegen.result != 'success' ||
          needs.parity.result != 'success' ||
          needs.oracle.result != 'success' ||
          needs.bench-tools.result != 'success'
        run: |
          echo "One or more required Trace CI jobs failed or were cancelled."
          exit 1
