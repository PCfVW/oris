[package]
name = "orisnik"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Eric Jacopin"]
license = "MIT OR Apache-2.0"
description = "A Rust port of Dimitar Lazarov's HPHA (2007): a bucket + red-black-tree best-fit heap allocator, with oris_* C-ABI, GlobalAlloc, and optional Allocator surfaces."
repository = "https://github.com/PCfVW/oris"
homepage = "https://github.com/PCfVW/oris"
readme = "README.md"
keywords = ["allocator", "heap", "memory", "global-allocator", "hpha"]
categories = ["memory-management"]
# Keeps the published package to source + license + README + the shared C header.
# CLAUDE.md/CONVENTIONS.md (AI-assistant wiring, coding conventions) and clippy.toml
# (this crate's own lint-floor config, not meaningful to a downstream consumer's
# build) stay GitHub-only — crates.io is the lean tier, the repo is the full tier.
exclude = ["CLAUDE.md", "CONVENTIONS.md", "clippy.toml"]

[lib]
name = "orisnik"
path = "src/lib.rs"
# "lib" (rlib) keeps this usable as an ordinary Rust dependency (`Orisnik`,
# `oris_*` via `pub use`); "cdylib"/"staticlib" additionally emit a real
# linkable C library (`liborisnik.so`/`.dylib`/`orisnik.dll` +
# `liborisnik.a`/`orisnik.lib`) so the oris_* C-ABI — implemented and tested
# since v0.1.0's `capi.rs` — is actually shippable to a C/C++ caller, not just
# compiled into the test binary. See `../include/oris.h` for the C prototypes
# (shared with the Zig port, which implements the identical ABI).
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Enables `unsafe impl core::alloc::Allocator for Orisnik` (src/allocator_trait.rs)
# via the still-unstable native `allocator_api` feature (rust-lang/rust#32838).
# Requires a nightly toolchain — `feature(allocator_api)` is itself nightly-gated
# syntax, so enabling this Cargo feature on stable is a hard compile error by
# design, not a bug. See INSTALL.md and Rust/CONVENTIONS.md's Idiomatic Surfaces
# section. The default build (`oris_*` + `GlobalAlloc`) needs none of this.
nightly = []

[target.'cfg(unix)'.dependencies]
# mmap/munmap and their flag constants (MAP_ANON differs numerically between Linux
# and macOS/BSD) — hand-rolling these is a well-known source of silent platform bugs,
# so the OS layer (src/os.rs) uses the ecosystem-standard bindings here instead of
# redeclaring them. Windows needs no such crate: VirtualAlloc/VirtualFree are two
# functions and three constants, declared directly in src/os.rs.
libc = "0.2"

# The Grit-ORIS lint floor (see Rust/CONVENTIONS.md). CI runs
# `cargo clippy --all-targets -- -D warnings`, so every `warn` below is a hard
# error there. NOTE: unlike the sibling parser crates, an allocator does NOT
# deny `unsafe_code` — unsafe is the work. `unsafe_op_in_unsafe_fn` (in lib.rs)
# plus the block-level clippy lints below keep it scoped and justified instead.
[lints.clippy]
# Pedantic net (priority -1 so the specific levels below win).
pedantic = { level = "warn", priority = -1 }

# Hot path never panics — out-of-memory is a value, not an exception.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Exhaustive matching over owned enums.
wildcard_enum_match_arm = "deny"

# Explicit conversions; prefer From/TryFrom and the strict-provenance helpers.
as_conversions = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"

# The load-bearing unsafe-discipline lints for an allocator.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
missing_safety_doc = "warn"

# API hygiene.
must_use_candidate = "warn"
missing_errors_doc = "warn"

# Noisy pedantic lints we opt out of.
module_name_repetitions = "allow"
too_many_lines = "allow"
